name: CI

on:
  push:
    branches: [master, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux GCC
            os: ubuntu-latest
            cc: gcc
            sanitizers: 'OFF'
            leaks: '0'
          - name: Linux Clang ASan
            os: ubuntu-latest
            cc: clang
            sanitizers: 'ON'
            leaks: '1'
          - name: macOS Clang ASan
            os: macos-latest
            cc: clang
            sanitizers: 'ON'
            leaks: '0'
    env:
      CC: ${{ matrix.cc }}
      ASAN_OPTIONS: detect_leaks=${{ matrix.leaks }}:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libevent-dev libssl-dev pkg-config
      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: |
          brew install libevent openssl@3 pkgconf
          echo "PKG_CONFIG_PATH=$(brew --prefix libevent)/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DENABLE_SANITIZERS=${{ matrix.sanitizers }}
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure --parallel 2
